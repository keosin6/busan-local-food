# 공통 설정. 프로필별 값은 application-local.yml, application-prod.yml을 본다.
# DB 접속 정보(DB_URL, DB_USERNAME, DB_PASSWORD)는 코드에 두지 않고 환경변수로만 받는다.
spring:
  application:
    name: busan-local-food
  profiles:
    # 프로필을 지정하지 않으면 local로 실행한다. 운영은 SPRING_PROFILES_ACTIVE=prod로 지정한다.
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # 스키마는 애플리케이션이 생성·변경하지 않는다. 스키마 관리 방식은 설계 변경 절차로 정한다 (Flyway 미도입).
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # 운영·개발 모두 MySQL 8을 사용한다. 방언을 명시해 DB 연결 실패 원인이 기동 오류에 그대로 드러나게 한다.
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: true

server:
  port: 8080

logging:
  level:
    root: info
    com.busanlocalfood: info
