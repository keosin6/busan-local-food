# 공통 설정. 프로필별 값은 application-local.yml, application-prod.yml을 본다.
# DB 접속 정보(DB_URL, DB_USERNAME, DB_PASSWORD)는 코드에 두지 않고 환경변수로만 받는다.
spring:
  application:
    name: busan-local-food
  profiles:
    # 프로필을 지정하지 않으면 local로 실행한다. 운영은 SPRING_PROFILES_ACTIVE=prod로 지정한다.
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB 세션 시간대를 서비스 시간대(Asia/Seoul)로 고정한다. NOW(), CURRENT_TIMESTAMP가 앱이 저장하는 시각과 같은 기준이 된다.
      # JVM 기본 시간대는 TimeConfig가 같은 값으로 고정한다. DB_URL에 다른 시간대 옵션을 넣지 않는다.
      connection-init-sql: SET time_zone = '+09:00'
  jpa:
    # 스키마는 애플리케이션이 생성·변경하지 않는다. 스키마 관리 방식은 설계 변경 절차로 정한다 (Flyway 미도입).
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # 운영·개발 모두 MySQL 8을 사용한다. 방언을 명시해 DB 연결 실패 원인이 기동 오류에 그대로 드러나게 한다.
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: true
  servlet:
    multipart:
      # 이미지 한 장 5MB 이하 (FUNCTION_SPEC F1-03). 요청 전체는 여유를 둔다. 초과는 IMAGE_TOO_LARGE로 응답한다.
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      # 요청 본문의 알 수 없는 필드는 거부한다. 400 VALIDATION_FAILED로 응답한다.
      fail-on-unknown-properties: true

# 요청 제한 (API_SPEC 1.4). HMAC 키는 환경 변수로만 주입한다. 기본값을 두지 않는다. JWT_SECRET과 달라야 한다.
auth:
  rate-limit:
    # Base64 인코딩 값, 디코딩 후 32바이트 이상. 누락이거나 형식·길이가 잘못되면 기동이 실패한다.
    hmac-secret: ${AUTH_RATE_LIMIT_HMAC_SECRET:}
    # 만료 이벤트 주기 정리: 한 번에 지우는 행 수, 주기(ms), 기동 후 첫 실행까지의 지연(ms).
    cleanup-batch-size: 1000
    cleanup-interval-ms: 600000
    cleanup-initial-delay-ms: 60000

# AI 리뷰 요약 (F1-05). OpenRouter의 OpenAI 호환 엔드포인트를 씁니다. 키와 모델 ID는 환경 변수로만 받습니다.
# 키나 모델 ID가 없으면 요약은 UNAVAILABLE로 응답하고 외부 호출을 하지 않습니다. 애플리케이션 기동은 실패하지 않습니다.
# 신뢰 프록시 IP 목록. 비어 있으면 X-Forwarded-For를 신뢰하지 않는다. 운영 기본값을 임의로 넣지 않는다.
# S3 이미지 저장소 (F1-03). 리전과 버킷은 환경 변수로만 받는다. 자격 증명은 AWS 기본 체인(환경 변수 또는 EC2 인스턴스 역할)을 쓴다.
# 값이 없으면 이미지 업로드와 삭제는 저장소 오류(502 STORAGE_ERROR)가 되고, 삭제 실패 객체는 storage_delete_task에 남는다.
app:
  ai:
    openrouter:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:}
      timeout-seconds: 10
  aws:
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
  security:
    trusted-proxies: []
  oauth2:
    google:
      # Google OAuth2 클라이언트. 값은 환경 변수로만 받는다. 코드와 설정 파일에 실제 값을 두지 않는다.
      # 둘 다 없으면 Google 로그인은 꺼진다(local). 운영(prod)에서 없으면 기동하지 않는다.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

jwt:
  # Base64로 인코딩한 32바이트 이상의 서명 키. 환경 변수로만 주입하며 저장소에 커밋하지 않는다.
  # 값이 없거나 형식·길이가 잘못되면 애플리케이션 기동이 실패한다.
  secret: ${JWT_SECRET:}
  # Access Token 만료 초. 기본 1800초(30분).
  access-token-expiry-seconds: ${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:1800}
  # Refresh Token 만료 초. 기본 1209600초(14일). Access Token 만료와 분리한다.
  refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:1209600}

server:
  port: 8080

logging:
  level:
    root: info
    com.busanlocalfood: info
