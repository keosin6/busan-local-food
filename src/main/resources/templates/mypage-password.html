<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 설정')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 480px;">
    <h1 class="h3 mb-3">로컬 비밀번호 설정</h1>
    <p class="text-muted">8~20자, 영문·숫자·특수문자를 각 1자 이상 포함하고, 공백은 쓸 수 없습니다.</p>

    <div th:if="${error == 'validation_failed'}" class="alert alert-danger" role="alert">
        비밀번호 조건을 확인해 주세요. 두 입력값이 같아야 합니다.
    </div>

    <form th:action="@{/mypage/password}" method="post" novalidate>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="mb-3">
            <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
            <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">비밀번호 설정</button>
    </form>

    <p class="mt-3 mb-0 text-center"><a th:href="@{/mypage}">마이페이지로 돌아가기</a></p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
