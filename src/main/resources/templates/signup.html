<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 480px;">
    <h1 class="h3 mb-4">회원가입</h1>

    <div th:if="${error == 'email_duplicated'}" class="alert alert-danger" role="alert">
        이미 가입된 이메일입니다.
    </div>
    <div th:if="${error == 'nickname_duplicated'}" class="alert alert-danger" role="alert">
        이미 사용 중인 닉네임입니다.
    </div>
    <div th:if="${error == 'validation_failed'}" class="alert alert-danger" role="alert">
        입력값을 확인해 주세요. 비밀번호는 8~20자, 영문·숫자·특수문자를 각 1자 이상 포함해야 하며, 확인 값이 같아야 합니다. 닉네임은 한글·영문·숫자 2~20자입니다.
    </div>

    <form th:action="@{/signup}" method="post" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="255" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" class="form-control" id="nickname" name="nickname" maxlength="20" required autocomplete="nickname">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="mb-3">
            <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
            <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">가입하기</button>
    </form>

    <p class="mt-3 mb-0 text-center">
        이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
