<!-- 맛집 카드 (목록과 홈이 함께 쓴다). 호출하는 화면은 restaurant, loggedIn, favoritedIds, listFrom, page, pageSize, keyword, sort, category를 모델에 둔다. -->
    <div th:fragment="card" class="card h-100" th:id="'restaurant-' + ${r.id()}">
        <img th:if="${r.thumbnailUrl() != null}" th:src="${r.thumbnailUrl()}" class="card-img-top"
             alt="맛집 사진" style="height: 160px; object-fit: cover;">
        <div th:unless="${r.thumbnailUrl() != null}"
             class="card-img-top bg-light text-muted small d-flex align-items-center justify-content-center"
             style="height: 160px;">사진 없음</div>
        <div class="card-body d-flex flex-column">
            <span class="badge text-bg-light align-self-start mb-2" th:text="${r.category().name()}">카테고리</span>
            <h2 class="h5 card-title">
                <a class="link-dark text-decoration-none" th:href="@{/restaurants/{id}(id=${r.id()})}"
                   th:text="${r.name()}">맛집 이름</a>
            </h2>
            <p class="card-text small text-muted mb-2" th:text="${r.address()}">주소</p>
            <p class="card-text mt-auto mb-0 small">
                평점 <span th:text="${r.averageRating()}">0.0</span>
                · 리뷰 <span th:text="${r.reviewCount()}">0</span>
            </p>
            <div class="mt-2">
                <form th:if="${loggedIn and !favoritedIds.contains(r.id())}" method="post"
                      th:action="@{/restaurants/{id}/favorite(id=${r.id()})}">
                    <input type="hidden" name="from" th:value="${listFrom}">
                    <input type="hidden" name="category" th:if="${category != null}" th:value="${category}">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="sort" th:value="${sort}">
                    <input type="hidden" name="page" th:value="${page}">
                    <input type="hidden" name="size" th:value="${pageSize}">
                    <button type="submit" class="btn btn-outline-danger btn-sm" aria-pressed="false">♡ 찜하기</button>
                </form>
                <form th:if="${loggedIn and favoritedIds.contains(r.id())}" method="post"
                      th:action="@{/restaurants/{id}/favorite/delete(id=${r.id()})}">
                    <input type="hidden" name="from" th:value="${listFrom}">
                    <input type="hidden" name="category" th:if="${category != null}" th:value="${category}">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="sort" th:value="${sort}">
                    <input type="hidden" name="page" th:value="${page}">
                    <input type="hidden" name="size" th:value="${pageSize}">
                    <button type="submit" class="btn btn-danger btn-sm" aria-pressed="true">♥ 찜 취소</button>
                </form>
                <a th:unless="${loggedIn}" class="btn btn-outline-secondary btn-sm"
                   th:href="@{/login}">로그인하고 찜하기</a>
            </div>
        </div>
    </div>
