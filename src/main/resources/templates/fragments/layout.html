<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | 부산 맛집'">부산 맛집</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" th:href="@{/}">부산 맛집</a>
        <div th:if="${!loggedIn}" class="d-flex gap-3">
            <a class="nav-link text-white p-0" th:href="@{/login}">로그인</a>
            <a class="nav-link text-white p-0" th:href="@{/signup}">회원가입</a>
        </div>
        <form th:if="${loggedIn}" id="logout-form" th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2 mb-0">
            <span id="logout-error" class="small text-warning d-none" role="alert"></span>
            <button type="submit" class="btn btn-sm btn-outline-light">로그아웃</button>
        </form>
    </div>
</header>
<footer th:fragment="footer" class="app-footer text-center text-muted py-3 border-top">
    <small>부산 맛집 정보 및 리뷰 플랫폼 (기본 골격)</small>
</footer>
<div th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/logout.js}"></script>
</div>
</body>
</html>
