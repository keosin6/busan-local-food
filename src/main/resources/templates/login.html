<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 480px;">
    <h1 class="h3 mb-4">로그인</h1>

    <div th:if="${error == 'invalid_credentials'}" class="alert alert-danger" role="alert">
        이메일 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div th:if="${error == 'validation_failed'}" class="alert alert-danger" role="alert">
        입력값을 확인해 주세요.
    </div>

    <form th:action="@{/login}" method="post" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="255" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>

    <p class="mt-3 mb-0 text-center">
        계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
