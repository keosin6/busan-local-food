<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AI 맛집 추천')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4 flex-grow-1" style="max-width: 880px;">
    <h1 class="h3 mb-2">AI 맛집 추천</h1>
    <p class="text-muted small mb-3">원하는 분위기나 메뉴를 적으면, 최근 등록된 맛집 최대 100곳 가운데서 AI가 골라 드립니다.</p>

    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}">오류</div>

    <form method="post" th:action="@{/recommend}" class="card card-body mb-4" novalidate>
        <label for="preference" class="form-label">취향 <span class="text-muted small">(1~200자)</span></label>
        <textarea class="form-control" id="preference" name="preference" rows="3" maxlength="200" required
                  placeholder="예: 2명이서 조용히 먹을 매운 국물 요리" th:text="${preference}"></textarea>
        <div class="d-flex justify-content-end mt-2">
            <button type="submit" class="btn btn-primary">추천 받기</button>
        </div>
    </form>

    <section th:if="${result != null}" aria-labelledby="result-title">
        <h2 class="h5" id="result-title">추천 결과</h2>
        <p th:if="${result.candidateCount() > 0}" class="text-muted small mb-2"
           th:text="'후보 ' + ${result.candidateCount()} + '곳 중에서 골랐습니다.'">후보 0곳 중에서 골랐습니다.</p>
        <div th:if="${result.message() != null}" class="alert alert-secondary" role="status" th:text="${result.message()}">안내</div>

        <div class="row row-cols-1 row-cols-md-2 g-3" th:unless="${#lists.isEmpty(result.recommendations())}">
            <div class="col" th:each="r : ${result.recommendations()}">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <span class="badge text-bg-light align-self-start mb-2" th:text="${r.category()}">카테고리</span>
                        <h3 class="h5 card-title">
                            <a class="link-dark text-decoration-none" th:href="@{/restaurants/{id}(id=${r.restaurantId()})}"
                               th:text="${r.name()}">맛집 이름</a>
                        </h3>
                        <p class="small mb-2">평균 평점 <span th:text="${r.averageRating()}">0.0</span></p>
                        <p class="card-text mb-3" style="white-space: pre-line;" th:text="${r.reason()}">추천 이유</p>
                        <a class="btn btn-outline-dark btn-sm mt-auto align-self-start"
                           th:href="@{/restaurants/{id}(id=${r.restaurantId()})}">맛집 상세 보기</a>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-muted small mt-3">추천 결과는 저장하지 않습니다. 다른 취향을 입력해 다시 받을 수 있습니다.</p>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
