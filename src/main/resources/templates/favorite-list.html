<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 찜 목록')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4 flex-grow-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">내 찜 목록</h1>
        <a class="btn btn-outline-dark btn-sm" th:href="@{/restaurants}">맛집 목록</a>
    </div>

    <div th:if="${notice != null}" class="alert alert-info py-2" role="status" th:text="${notice}">안내</div>

    <p class="text-muted small mb-2" th:text="'총 ' + ${totalElements} + '개'">총 0개</p>

    <div th:if="${#lists.isEmpty(restaurants)}" class="alert alert-secondary" role="status">
        아직 찜한 맛집이 없습니다. <a th:href="@{/restaurants}">맛집 목록</a>에서 마음에 드는 곳을 찜해 보세요.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col" th:each="r : ${restaurants}">
            <div class="card h-100">
                <img th:if="${r.thumbnailUrl() != null}" th:src="${r.thumbnailUrl()}" class="card-img-top"
                     alt="맛집 사진" style="height: 160px; object-fit: cover;">
                <div th:unless="${r.thumbnailUrl() != null}"
                     class="card-img-top bg-light text-muted small d-flex align-items-center justify-content-center"
                     style="height: 160px;">사진 없음</div>
                <div class="card-body d-flex flex-column">
                    <span class="badge text-bg-light align-self-start mb-2" th:text="${r.category().name()}">카테고리</span>
                    <h2 class="h5 card-title">
                        <a class="link-dark text-decoration-none" th:href="@{/restaurants/{id}(id=${r.id()})}"
                           th:text="${r.name()}">맛집 이름</a>
                    </h2>
                    <p class="card-text small text-muted mb-2" th:text="${r.address()}">주소</p>
                    <p class="card-text small mb-2">
                        평점 <span th:text="${r.averageRating()}">0.0</span>
                        · 리뷰 <span th:text="${r.reviewCount()}">0</span>
                    </p>
                    <form class="mt-auto" method="post"
                          th:action="@{/restaurants/{id}/favorite/delete(id=${r.id()})}"
                          data-confirm="이 맛집을 찜 목록에서 뺄까요?">
                        <input type="hidden" name="from" value="favorites">
                        <input type="hidden" name="page" th:value="${page}">
                        <button type="submit" class="btn btn-outline-danger btn-sm">찜 취소</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-4" aria-label="페이지" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!hasPrev} ? 'disabled'">
                <a class="page-link" th:href="@{/favorites(page=${prevPage})}" th:unless="${!hasPrev}">이전</a>
                <span class="page-link" th:if="${!hasPrev}">이전</span>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${page + 1} + ' / ' + ${totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/favorites(page=${nextPage})}" th:unless="${!hasNext}">다음</a>
                <span class="page-link" th:if="${!hasNext}">다음</span>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
