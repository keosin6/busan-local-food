<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('맛집 관리')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <h1 class="h3 mb-3">맛집 관리</h1>
    <div th:replace="~{fragments/admin-nav :: nav('restaurants')}"></div>

    <div th:if="${notice != null}" class="alert alert-success" role="status" th:text="${notice}">알림</div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}">오류</div>

    <form method="get" th:action="@{/admin/restaurants}" class="row g-2 align-items-end mb-3">
        <div class="col-12 col-md-4">
            <label for="keyword" class="form-label">검색어 (이름·주소)</label>
            <input type="search" class="form-control" id="keyword" name="keyword" maxlength="50" th:value="${keyword}">
        </div>
        <div class="col-6 col-md-3">
            <label for="categoryId" class="form-label">카테고리</label>
            <select class="form-select" id="categoryId" name="categoryId">
                <option value="">전체</option>
                <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.name()}"
                        th:selected="${categoryId != null and categoryId == c.id()}">카테고리</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="sort" class="form-label">정렬</label>
            <select class="form-select" id="sort" name="sort">
                <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                <option value="rating" th:selected="${sort == 'rating'}">평점순</option>
            </select>
        </div>
        <div class="col-12 col-md-3 d-grid">
            <button type="submit" class="btn btn-outline-dark">검색</button>
        </div>
    </form>

    <p class="small text-muted mb-2" th:text="'총 ' + ${result.totalElements()} + '개'">총 0개</p>
    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">이름</th>
                <th scope="col">카테고리</th>
                <th scope="col">주소</th>
                <th scope="col" class="text-end">평점</th>
                <th scope="col" class="text-end">리뷰</th>
                <th scope="col" class="text-end">사진</th>
                <th scope="col">작성자</th>
                <th scope="col">등록일</th>
                <th scope="col">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${result.content()}">
                <td th:text="${r.id()}">1</td>
                <td><a th:href="@{/restaurants/{id}(id=${r.id()})}" th:text="${r.name()}">맛집</a></td>
                <td th:text="${r.category().name()}">한식</td>
                <td th:text="${r.address()}">주소</td>
                <td class="text-end" th:text="${r.averageRating()}">0.0</td>
                <td class="text-end" th:text="${r.reviewCount()}">0</td>
                <td class="text-end" th:text="${r.imageCount()}">0</td>
                <td>
                    <span th:text="${r.owner().nickname()}">작성자</span><br>
                    <small class="text-muted" th:text="${r.owner().email()}">email</small>
                </td>
                <td class="small" th:text="${#temporals.format(r.createdAt(), 'yyyy-MM-dd')}">2026-11-01</td>
                <td class="text-nowrap">
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/restaurants/{id}/edit(id=${r.id()})}">수정</a>
                    <form class="d-inline" method="post" th:action="@{/admin/restaurants/{id}/delete(id=${r.id()})}"
                          data-confirm="이 맛집을 삭제할까요? 사진, 찜, 리뷰, AI 요약이 함께 삭제되며 되돌릴 수 없습니다.">
                        <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${#lists.isEmpty(result.content())}" class="alert alert-secondary" role="status">조건에 맞는 맛집이 없습니다.</p>

    <nav aria-label="페이지" th:if="${result.totalPages() > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${result.page() == 0} ? 'disabled'">
                <a class="page-link" th:href="@{${'/admin/restaurants?' + baseQuery + '&page=' + (result.page() - 1)}}"
                   th:unless="${result.page() == 0}">이전</a>
                <span class="page-link" th:if="${result.page() == 0}">이전</span>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${result.page() + 1} + ' / ' + ${result.totalPages()}">1 / 1</span></li>
            <li class="page-item" th:classappend="${result.page() + 1 >= result.totalPages()} ? 'disabled'">
                <a class="page-link" th:href="@{${'/admin/restaurants?' + baseQuery + '&page=' + (result.page() + 1)}}"
                   th:unless="${result.page() + 1 >= result.totalPages()}">다음</a>
                <span class="page-link" th:if="${result.page() + 1 >= result.totalPages()}">다음</span>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
