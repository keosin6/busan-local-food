<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('S3 삭제 재시도')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-4 flex-grow-1">
    <h1 class="h3 mb-3">S3 삭제 재시도</h1>
    <div th:replace="~{fragments/admin-nav :: nav('storage')}"></div>

    <div th:if="${notice != null}" class="alert alert-success" role="status" th:text="${notice}">알림</div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}">오류</div>
    <div th:if="${retryResult != null}" class="alert alert-info" role="status">
        처리 <span th:text="${retryResult.processed()}">0</span>건,
        성공 <span th:text="${retryResult.succeeded()}">0</span>건,
        실패 <span th:text="${retryResult.failed()}">0</span>건
    </div>

    <p class="small text-muted">DB에서 지워졌지만 S3 객체를 아직 지우지 못한 키 목록입니다. 자동 재시도는 없으며, 아래 버튼을 눌렀을 때만 다시 시도합니다.</p>

    <form method="post" th:action="@{/admin/storage-deletions/retry}" class="mb-3" data-once
          data-confirm="대기 중인 S3 객체 삭제를 모두 다시 시도할까요?">
        <button type="submit" class="btn btn-primary">수동 재시도 실행</button>
    </form>

    <p class="small text-muted mb-2" th:text="'대기 ' + ${result.totalElements()} + '건'">대기 0건</p>
    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">S3 키</th>
                <th scope="col" class="text-end">재시도 횟수</th>
                <th scope="col">마지막 오류</th>
                <th scope="col">생성</th>
                <th scope="col">갱신</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${result.content()}">
                <td th:text="${t.id()}">1</td>
                <td class="small text-break" th:text="${t.s3Key()}">key</td>
                <td class="text-end" th:text="${t.retryCount()}">0</td>
                <td class="small" th:text="${t.lastError()}">오류</td>
                <td class="small" th:text="${#temporals.format(t.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-11-01 12:00</td>
                <td class="small" th:text="${#temporals.format(t.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-11-01 12:00</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${#lists.isEmpty(result.content())}" class="alert alert-secondary" role="status">재시도 대기 중인 항목이 없습니다.</p>

    <nav aria-label="페이지" th:if="${result.totalPages() > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${result.page() == 0} ? 'disabled'">
                <a class="page-link" th:href="@{${'/admin/storage-deletions?' + baseQuery + '&page=' + (result.page() - 1)}}"
                   th:unless="${result.page() == 0}">이전</a>
                <span class="page-link" th:if="${result.page() == 0}">이전</span>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${result.page() + 1} + ' / ' + ${result.totalPages()}">1 / 1</span></li>
            <li class="page-item" th:classappend="${result.page() + 1 >= result.totalPages()} ? 'disabled'">
                <a class="page-link" th:href="@{${'/admin/storage-deletions?' + baseQuery + '&page=' + (result.page() + 1)}}"
                   th:unless="${result.page() + 1 >= result.totalPages()}">다음</a>
                <span class="page-link" th:if="${result.page() + 1 >= result.totalPages()}">다음</span>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
