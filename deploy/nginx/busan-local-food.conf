# Nginx reverse proxy 설정. 설치 경로: /etc/nginx/sites-available/busan-local-food (sites-enabled에 심볼릭 링크).
#
# [단계 1: 도메인 연결 전] 임시 HTTP만 사용한다. 아래 server 블록 하나만 쓴다.
#   - 서버 IP로 http://<EC2 공인 IP>/ 접속. HTTPS와 도메인이 없으므로 Secure 쿠키(운영 프로필)는 브라우저가 저장하지 않는다.
#     즉 화면 로그인·API 인증은 이 단계에서 동작하지 않는다 (docs/DEPLOYMENT.md 8절).
#   - 홈 화면, 맛집 목록·상세 같은 비로그인 화면 확인용이다.
#
# [단계 2: 도메인 연결 후] server_name을 실제 도메인으로 바꾸고 certbot으로 HTTPS를 적용한다 (docs/DEPLOYMENT.md 8절).
#   HTTP는 HTTPS로 리다이렉트하고, 아래 HTTPS 블록의 주석을 해제한다.

# IPv4 전용 구성. 이 저장소는 IPv6 지원을 확인하지 않았으므로 IPv6 listen(listen [::]:...)을 두지 않는다.
# IPv6가 꺼진 Ubuntu에서도 nginx -t가 통과해야 setup-ec2.sh가 끝까지 진행된다.
server {
    listen 80 default_server;
    # 도메인 연결 전에는 모든 Host를 받는다. 도메인 연결 후 실제 도메인으로 좁힌다.
    server_name _;

    # 이미지 업로드 한 번에 최대 6MB (application.yml max-request-size 6MB). Nginx 기본값 1MB는 업로드를 막으므로 올린다.
    client_max_body_size 6m;

    # 앱이 빠르게 응답하지 않을 때 Nginx가 오래 붙잡지 않도록 한다. AI 요약 10초 제한을 고려해 여유를 둔다.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # 보안 헤더 (기본). HSTS는 HTTPS 전환 뒤에만 추가한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/busan-local-food.access.log;
    error_log  /var/log/nginx/busan-local-food.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # 신뢰 프록시 규칙: 앱의 APP_SECURITY_TRUSTED_PROXIES=127.0.0.1과 맞춘다.
        # 클라이언트가 보낸 X-Forwarded-For는 뒤에 붙고, 앱이 신뢰 프록시를 건너뛰며 실제 IP를 고른다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

