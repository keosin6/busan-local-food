# MySQL의 EBS 마운트 의존성 drop-in.
# 설치 경로: /etc/systemd/system/mysql.service.d/ebs-data-mount.conf
# 기존 mysql.service 파일은 바꾸지 않는다. 이 파일만 추가한다.
#
# 목적: EBS(/data)가 분리되었거나 마운트에 실패했을 때 MySQL이 루트 볼륨의 빈 /data/mysql 에 데이터를 쓰지 않도록 한다.
#   - RequiresMountsFor=/data/mysql : /data/mysql 을 담는 마운트 유닛이 성공해야 MySQL을 시작한다.
#                                     마운트가 멈추면 MySQL도 함께 멈춘다 (Requires 의존).
#   - AssertPathIsMountPoint=/data  : /data 가 실제 마운트 지점이 아니면 시작을 거부하고 이유를 남긴다.
#                                     fstab 항목이 없거나 nofail로 마운트가 빠진 경우에도 루트 볼륨에 기록하지 않게 하는 마지막 방어선이다.
[Unit]
RequiresMountsFor=/data/mysql
AssertPathIsMountPoint=/data
