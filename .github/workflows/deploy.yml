# 운영 배포 워크플로. main에 병합(push)되면 테스트·bootJar 빌드 후 EC2에 배포한다.
# 장기 AWS 키는 쓰지 않는다. GitHub OIDC로 임시 자격 증명을 받는다.
# 필요한 Repository Variables(비밀 아님): AWS_REGION, AWS_DEPLOY_ROLE_ARN, DEPLOY_ARTIFACT_BUCKET, EC2_INSTANCE_ID
# 자세한 설정은 docs/DEPLOYMENT.md 9~10절.
#
# DB 테스트: 이 워크플로가 띄우는 MySQL 8 서비스 컨테이너(테스트 전용)에만 연결한다. 운영 DB에는 접속하지 않는다.
# 테스트 DB 값은 아래 env에만 있고, 러너 안에서만 열린다. 운영 값과 무관하다.
# 테스트가 실패하거나 DB 테스트가 건너뛰어지면 배포 단계까지 가지 않는다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만 돈다. 진행 중인 배포를 끊지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # OIDC 토큰 발급 (AWS 임시 자격 증명)

    # 테스트 전용 MySQL 8. 러너 안에서만 접근한다 (포트는 러너의 localhost로만 열린다).
    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: busan_local_food_test
          MYSQL_USER: busan_test
          MYSQL_PASSWORD: busan_ci_only_password
          MYSQL_ROOT_PASSWORD: busan_ci_root_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pbusan_ci_root_only_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 배포 스크립트 가짜 명령 테스트와 구문 검사
        run: |
          set -euo pipefail
          for f in deploy/scripts/*.sh deploy/tests/*.sh; do bash -n "$f"; done
          bash deploy/tests/test-deploy-rollback.sh
          bash deploy/tests/test-mount-data-volume.sh
          bash deploy/tests/test-mysql-dropin.sh
          bash deploy/tests/test-ssm-wait.sh

      - name: 테스트 DB 스키마 적용 (수동 SQL 001~008, 테스트 DB만)
        env:
          MYSQL_PWD: busan_ci_only_password
        run: |
          set -euo pipefail
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client
          fi
          for f in $(ls db/manual/*.sql | sort); do
            echo "apply $f"
            mysql --ssl-mode=REQUIRED -h 127.0.0.1 -P 3306 -u busan_test busan_local_food_test < "$f"
          done

      - name: 테스트 (DB 테스트 포함)
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/busan_local_food_test?characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
          TEST_DB_USERNAME: busan_test
          TEST_DB_PASSWORD: busan_ci_only_password
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --no-daemon

      - name: 테스트 결과 검사 (건너뛴 테스트가 있으면 실패)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = skipped = failed = db_tests = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests'))
              skipped += int(root.get('skipped'))
              failed += int(root.get('failures')) + int(root.get('errors'))
              if root.get('name', '').endswith('DbTest'):
                  db_tests += int(root.get('tests'))
          print(f'tests={total} skipped={skipped} failed={failed} db_test_cases={db_tests}')
          if failed or skipped or db_tests == 0:
              sys.exit('테스트 실패, 건너뜀 또는 DB 테스트 미실행')
          PY

      - name: 실행 JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: 아티팩트 준비와 SHA-256 계산
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          test -f "$JAR"
          mkdir -p deploy-out
          cp "$JAR" "deploy-out/${GITHUB_SHA}.jar"
          echo "JAR_SHA256=$(sha256sum "deploy-out/${GITHUB_SHA}.jar" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: AWS 임시 자격 증명 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 아티팩트 업로드 (배포 전용 S3, releases/ 경로만)
        run: |
          set -euo pipefail
          aws s3 cp "deploy-out/${GITHUB_SHA}.jar" \
            "s3://${{ vars.DEPLOY_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}.jar" \
            --sse AES256 --only-show-errors

      - name: EC2에 배포 명령 전달 (SSM Run Command)
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD="/opt/busan-local-food/bin/deploy.sh ${GITHUB_SHA} ${JAR_SHA256}"
          jq -nc --arg c "$CMD" '{commands: [$c]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command id: $CMD_ID"

      - name: 배포 결과 기다리기 (명시적 대기 시간)
        # 대기 한도 1080초 = SSM 명령 제한 900초 + 여유 180초. 워크플로가 SSM보다 먼저 포기하지 않도록 한다.
        # aws ssm wait의 기본 한도(15초 × 100회 = 1500초)에 의존하지 않고 직접 폴링한다.
        # 한도를 넘으면 실패로 끝내고, 명령 ID로 서버 상태를 확인하도록 안내한다 (배포가 계속 진행 중일 수 있음).
        if: always() && steps.send.outcome == 'success'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 1080 ))
          STATUS="Pending"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # 명령 직후에는 호출이 InvocationDoesNotExist로 실패할 수 있다. 그때는 Pending으로 보고 계속 기다린다.
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
              *) sleep 15 ;;
            esac
          done
          # 출력은 deploy.sh가 남긴 문장만 보여 준다. 비밀 값은 출력되지 않는다.
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
          case "$STATUS" in
            Success) echo "배포 명령 성공"; exit 0 ;;
            Failed|TimedOut|Cancelled|Cancelling) echo "배포 명령 실패 (상태: $STATUS). 종료 코드 3은 이전 버전도 실패했다는 뜻이다. docs/DEPLOYMENT.md 11.2절."; exit 1 ;;
            *) echo "대기 한도(1080초)를 넘었다. 마지막 상태: $STATUS. 명령 $CMD_ID 가 아직 진행 중일 수 있으니 서버 상태를 직접 확인하세요."; exit 1 ;;
          esac
