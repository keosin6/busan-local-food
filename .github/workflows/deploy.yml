# 운영 배포 워크플로. main에 병합(push)되면 테스트·bootJar 빌드 후 EC2에 배포한다.
# 기존 CI 워크플로는 없었다. 이 파일이 저장소의 첫 워크플로다.
# 장기 AWS 키는 쓰지 않는다. GitHub OIDC로 임시 자격 증명을 받는다.
# 필요한 Repository Variables(비밀 아님): AWS_REGION, AWS_DEPLOY_ROLE_ARN, DEPLOY_ARTIFACT_BUCKET, EC2_INSTANCE_ID
# 자세한 설정은 docs/DEPLOYMENT.md 9~10절.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만 돈다. 진행 중인 배포를 끊지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # OIDC 토큰 발급 (AWS 임시 자격 증명)
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 (DB 없이 실행, DB 테스트는 건너뜀)
        # CI에는 MySQL을 띄우지 않는다. DB 테스트(@DataJpaTest, AdminServiceDbTest 등)는 건너뛰어진다.
        # 운영 DB 검증은 docs/DEPLOYMENT.md의 테스트 절차로 따로 한다.
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --no-daemon

      - name: 실행 JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: 아티팩트 준비와 SHA-256 계산
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          test -f "$JAR"
          mkdir -p deploy-out
          cp "$JAR" "deploy-out/${GITHUB_SHA}.jar"
          echo "JAR_SHA256=$(sha256sum "deploy-out/${GITHUB_SHA}.jar" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: AWS 임시 자격 증명 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 아티팩트 업로드 (배포 전용 S3)
        run: |
          set -euo pipefail
          aws s3 cp "deploy-out/${GITHUB_SHA}.jar" \
            "s3://${{ vars.DEPLOY_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}.jar" \
            --sse AES256 --only-show-errors

      - name: EC2에 배포 명령 전달 (SSM Run Command)
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD="/opt/busan-local-food/bin/deploy.sh ${GITHUB_SHA} ${JAR_SHA256}"
          jq -nc --arg c "$CMD" '{commands: [$c]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command id: $CMD_ID"

      - name: 배포 결과 기다리기
        if: always() && steps.send.outcome == 'success'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          RESULT=$?
          # 출력은 서버 로그(deploy.sh가 남긴 문장)만 보여 준다. 비밀 값은 출력되지 않는다.
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          exit $RESULT
