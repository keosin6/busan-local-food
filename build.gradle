plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.busanlocalfood'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // AWS SDK v2 버전은 BOM으로 한 곳에서 고정한다 (F1-03 S3 이미지 저장).
        mavenBom 'software.amazon.awssdk:bom:2.31.78'
        // Spring AI는 Spring Boot 3.5와 맞는 1.1.x 라인을 쓴다 (AI 리뷰 요약, F1-05). 버전은 이 BOM이 정한다.
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // S3 객체 업로드·삭제 (F1-03). 버전은 위 BOM이 정한다.
    implementation 'software.amazon.awssdk:s3'
    // OpenRouter 호출 (AI 리뷰 요약, F1-05). OpenRouter는 OpenAI 호환 API이므로 OpenAI 스타터를 쓴다.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 JVM도 서비스 시간대(TimeConfig.SERVICE_ZONE)로 실행한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
}
